<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Shubham</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#0F0B18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@900&family=Barlow:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --night: #0f0b18; --mist: #e4def0; --mist-dim: #a99fc2; --gold: #f0b54a; --ink: #17121f; --a: #ff3d6e; --b: #2de2e6; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--night); color: var(--mist); font-family: 'Barlow', system-ui, sans-serif; }
      body { display: grid; place-items: center; overflow: hidden; position: relative; padding: 24px; }
      body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(55% 45% at 50% 40%, rgb(140 107 255 / 0.22), transparent 70%); pointer-events: none; }
      body::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgb(255 255 255 / 0.06) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
      main { position: relative; text-align: center; max-width: 36rem; }
      h1 { font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 900; font-size: clamp(8rem, 34vw, 20rem); line-height: 0.8; letter-spacing: 0.01em; position: relative; display: inline-block; }
      h1::before, h1::after { content: attr(data-text); position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
      h1::before { color: var(--a); transform: translateX(-0.03em); animation: a 3s steps(1) infinite; }
      h1::after { color: var(--b); transform: translateX(0.03em); animation: b 3s steps(1) infinite; }
      @keyframes a { 0%, 70%, 100% { clip-path: inset(0); } 72% { clip-path: inset(15% 0 60% 0); transform: translateX(-0.1em); } 75% { clip-path: inset(55% 0 20% 0); transform: translateX(0.06em); } }
      @keyframes b { 0%, 70%, 100% { clip-path: inset(0); } 72% { clip-path: inset(65% 0 10% 0); transform: translateX(0.1em); } 75% { clip-path: inset(25% 0 55% 0); transform: translateX(-0.06em); } }
      p.lead { margin-top: 1.75rem; font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 900; text-transform: uppercase; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 0.95; }
      p.sub { margin-top: 0.75rem; color: var(--mist-dim); font-size: 1.05rem; line-height: 1.5; }
      a { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 2rem; padding: 1rem 1.9rem; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; transition: background-color 200ms ease-out; }
      a:hover { background: #f7c96e; }
      a:focus-visible { outline: 2px solid #8c6bff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { h1::before, h1::after { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1 data-text="404">404</h1>
      <p class="lead">This frame didn't render.</p>
      <p class="sub">The page you're looking for doesn't exist or has moved.</p>
      <a href="/">Back to the portfolio <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
    </main>
  </body>
</html>
